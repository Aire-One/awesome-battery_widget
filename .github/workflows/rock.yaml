name: Upload rock to LuaRocks

on:
  push:

jobs:
  affected:
    uses: lunarmodules/.github/.github/workflows/list_affected_rockspecs.yml@d3b39c89365b06e9590297cfaa0b3c9e52c04b6d # main
  upload:
    needs: affected
    if: >-
      ${{
        github.repository == 'Aire-One/awesome-battery_widget' &&
        ( github.ref_name == 'master' || startsWith(github.ref, 'refs/tags/') ) &&
        needs.affected.outputs.rockspecs
      }}
    uses: lunarmodules/.github/.github/workflows/upload_to_luarocks.yml@d3b39c89365b06e9590297cfaa0b3c9e52c04b6d # main
    with:
      rockspecs: ${{ needs.affected.outputs.rockspecs }}
    secrets:
      apikey: ${{ secrets.LUAROCKS_APIKEY }}
